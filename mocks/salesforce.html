    const NOTES = {
      top: 'My Pipeline Refresh alone accounts for 3,366 of the 8,998 tracked interactions. Sellers were not browsing the page. They were pressing refresh on the one number they are measured against.',
      bottom: 'Three of the five least-used features were asked for by name in advisory sessions. The engagements view the group pushed hardest for was opened 53 times in five weeks. Requested is not the same as used.',
      bu: 'Commercial Accounts logged 4,236 interactions and Select logged 7. A page adopted by two business units and ignored by three is not an adopted page, and the average would have hidden it completely.',
      role: 'Usage concentrates in the two Account Executive titles, which is the group the AE layout was designed for. The director-level titles using it are the signal that the leader view was not doing its job yet.',
    };

    function render(container, rows, lowClass) {
      if (!container) return;
      const max = Math.max.apply(null, rows.map((r) => r[1]));
      container.innerHTML = rows.map((r) => `
        <div class="abar">
          <span class="abar__label">${r[0]}</span>
          <span class="abar__n">${r[1].toLocaleString()}</span>
          <span class="abar__track"><span class="abar__fill${lowClass ? ' abar__fill--low' : ''}" data-w="${Math.max(2, Math.round((r[1] / max) * 100))}"></span></span>
        </div>`).join('');
      /* One tick is enough to give the transition a start value to
         animate from, and a timeout does not depend on a frame being
         produced the way requestAnimationFrame does. */
      container.querySelectorAll('.abar__fill').forEach((f, i) => {
        setTimeout(() => { f.style.width = f.dataset.w + '%'; }, 20 + i * 70);
      });
    }

    let featureSet = 'top';
    function showFeature(set) {
      featureSet = set;
      render(document.getElementById('adoptFeatureBars'), set === 'top' ? TOP : BOTTOM, set === 'bottom');
      if (toggle) toggle.querySelectorAll('.adopt__togglebtn').forEach((b) => b.classList.toggle('is-active', b.dataset.set === set));
      if (note) note.textContent = NOTES[set];
    }

    function showPanel(name) {
      panels.forEach((p) => p.classList.toggle('is-active', p.dataset.panel === name));
      if (tabs) tabs.querySelectorAll('.adopt__tab').forEach((t) => t.classList.toggle('is-active', t.dataset.panel === name));
      if (name === 'feature') showFeature(featureSet);
      if (name === 'bu') { render(document.getElementById('adoptBuBars'), BU, false); if (note) note.textContent = NOTES.bu; }
      if (name === 'role') { render(document.getElementById('adoptRoleBars'), ROLE, false); if (note) note.textContent = NOTES.role; }
    }

    function reset() {
      featureSet = 'top';
      showPanel('feature');
    }

    if (tabs) {
      tabs.addEventListener('click', (e) => {
        const t = e.target.closest('.adopt__tab');
        if (t) showPanel(t.dataset.panel);
      });
    }
    if (toggle) {
      toggle.addEventListener('click', (e) => {
        const b = e.target.closest('.adopt__togglebtn');
        if (b) showFeature(b.dataset.set);
      });
    }

    reset();

    createDemo({
      mock,
      stateEl: document.getElementById('adoptState'),
      stateLabel: document.getElementById('adoptStateLabel'),
      replayBtn: document.getElementById('adoptReplay'),
      reset,
      threshold: 0.25,
      script: async (ctx) => {
        for (;;) {
          showPanel('feature');
          showFeature('top');
          await ctx.pause(4200);
          showFeature('bottom');
          await ctx.pause(4200);
          showPanel('bu');
          await ctx.pause(4200);
          showPanel('role');
          await ctx.pause(4200);
        }
      },
    });
  })();

  /* =========================================================
     Page chrome: jump nav, current page, email menu
     ========================================================= */
  document.querySelectorAll('.jump-nav a').forEach((link) => {
    link.addEventListener('click', (e) => {
      const id = link.getAttribute('href').slice(1);
      const target = document.getElementById(id);
      if (!target) return;
      e.preventDefault();
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  const path = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.nav-links a').forEach((link) => {
    const href = link.getAttribute('href');
    if (href === path) {
      link.setAttribute('aria-current', 'page');
    } else {
      link.removeAttribute('aria-current');
    }
  });

  const EMAIL_ADDRESS = 'elizabethkindt.design@gmail.com';
  const EMAIL_SUBJECT = 'Hello From Your Portfolio';
  const emailTrigger = document.getElementById('emailTrigger');
  const emailMenu = document.getElementById('emailMenu');

  if (emailTrigger && emailMenu) {
    const closeMenu = () => {
      emailMenu.hidden = true;
      emailTrigger.setAttribute('aria-expanded', 'false');
    };

    emailTrigger.addEventListener('click', (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      e.preventDefault();
      const isHidden = emailMenu.hidden;
      emailMenu.hidden = !isHidden;
      emailTrigger.setAttribute('aria-expanded', String(isHidden));
    });

    emailMenu.querySelectorAll('.email-choice__option').forEach((btn) => {
      btn.addEventListener('click', () => {
        const provider = btn.dataset.provider;
        const url = provider === 'gmail'
          ? `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(EMAIL_ADDRESS)}&su=${encodeURIComponent(EMAIL_SUBJECT)}`
          : `https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(EMAIL_ADDRESS)}&subject=${encodeURIComponent(EMAIL_SUBJECT)}`;
        window.open(url, '_blank', 'noopener');
        closeMenu();
      });
    });

    document.addEventListener('click', (e) => {
      if (!emailMenu.hidden && e.target !== emailTrigger && !emailMenu.contains(e.target)) {
        closeMenu();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !emailMenu.hidden) {
        closeMenu();
        emailTrigger.focus();
      }
    });
  }
});
</script>
</body></html>
