<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Archivo:wght@400;500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap');

:root {
  --color-bg: #FAF8F4;
  --color-surface: #F2E3DC;
  --color-accent: #8C4F52;
  --color-accent-deep: #2E1A14;
  --color-accent-deep-shadow: #1F110C;
  --color-rose: #CE8577;
  --color-rose-deep: #A8555F;
  --color-text-secondary: #86786C;
  --color-text-primary: #2E1A14;
  --color-white: #FFFFFF;

  --font-display: 'Fraunces', serif;
  --font-body: 'Archivo', sans-serif;
  --font-secondary: 'Newsreader', serif;

  --text-xs: 0.75rem;
  --text-sm: 0.9375rem;
  --text-base: 1.0625rem;
  --text-lg: 1.375rem;
  --text-xl: 2rem;
  --text-2xl: 3rem;
  --text-3xl: 4.5rem;

  --space-1: 0.5rem;
  --space-2: 1rem;
  --space-3: 1.5rem;
  --space-4: 2rem;
  --space-5: 3rem;
  --space-6: 4rem;
  --space-7: 6rem;
  --space-8: 8rem;

  --max-width: 1120px;
  --radius-sm: 6px;
  --radius-md: 14px;
  --radius-lg: 24px;

  --ease: cubic-bezier(0.4, 0, 0.2, 1);
  --duration: 0.4s;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

  font-family: var(--font-body);
  background: var(--color-bg);
  color: var(--color-text-primary);
  font-size: var(--text-base);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  cursor: url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgdmlld0JveD0iMCAwIDQwIDQwIj48cGF0aCBkPSJNMTkuMyAxNi40IEwxOC43IDMzLjYgTDIzLjIgMzAuMSBMMjUuNiAzNi41IEwyOC40IDM1LjIgTDI1LjQgMjkgTDMxLjIgMjguNiBaIiBmaWxsPSJub25lIiBzdHJva2U9IiNGQUY4RjQiIHN0cm9rZS13aWR0aD0iMy45IiBzdHJva2UtbGluZWpvaW49InJvdW5kIiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48cGF0aCBkPSJNMTkuMyAxNi40IEwxOC43IDMzLjYgTDIzLjIgMzAuMSBMMjUuNiAzNi41IEwyOC40IDM1LjIgTDI1LjQgMjkgTDMxLjIgMjguNiBaIiBmaWxsPSJub25lIiBzdHJva2U9IiMyRTFBMTQiIHN0cm9rZS13aWR0aD0iMi4zIiBzdHJva2UtbGluZWpvaW49InJvdW5kIiBzdHJva2UtbGluZWNhcD0icm91bmQiLz48ZyBmaWxsPSJub25lIiBzdHJva2U9IiMyRTFBMTQiIHN0cm9rZS13aWR0aD0iMS42NTYiIHN0cm9rZS1saW5lam9pbj0icm91bmQiIHN0cm9rZS1saW5lY2FwPSJyb3VuZCI+PHBhdGggZD0iTSAwIC01LjYgUSAxLjcgLTIuOCAwIDAgUSAtMS43IC0yLjggMCAtNS42IFoiIHRyYW5zZm9ybT0idHJhbnNsYXRlKDE4LjUsOS41KSByb3RhdGUoLTEyKSIvPjxwYXRoIGQ9Ik0gMCAtNS42IFEgMS43IC0yLjggMCAwIFEgLTEuNyAtMi44IDAgLTUuNiBaIiB0cmFuc2Zvcm09InRyYW5zbGF0ZSgxMi44LDExLjQpIHJvdGF0ZSgtNDgpIi8+PHBhdGggZD0iTSAwIC01LjYgUSAxLjcgLTIuOCAwIDAgUSAtMS43IC0yLjggMCAtNS42IFoiIHRyYW5zZm9ybT0idHJhbnNsYXRlKDguMiwxNy4yKSByb3RhdGUoLTg1KSIvPjwvZz48L3N2Zz4=') 19 16, auto;
}

* {
  cursor: inherit;
}

a:hover, a:hover *,
button:hover:not(:disabled), button:hover:not(:disabled) *,
label:hover, label:hover *,
input:not([disabled]):hover,
select:not([disabled]):hover,
textarea:not([disabled]):hover {

}

img { max-width: 100%; display: block; }
a { color: inherit; text-decoration: none; }

h1, h2, h3 {
  font-family: var(--font-display);
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.01em;
}

p { margin: 0 0 var(--space-2); }

.wrap {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 var(--space-4);
}

.prose { max-width: 700px; }
.prose > p:last-child { margin-bottom: 0; }

/* =========================================================
   Header / nav: copied from the homepage build
   ========================================================= */
.site-header {
  position: sticky;
  top: 0;
  z-index: 50;
  background: rgba(250, 248, 244, 0.85);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(36, 28, 24, 0.1);
}

.site-header__inner {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: var(--space-2) var(--space-4);
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  column-gap: var(--space-4);
}

nav[aria-label="Primary"] { justify-self: center; }
.logo-lockup { justify-self: start; display: flex; align-items: center; gap: 0.55rem; }

.nav-links { display: flex; gap: var(--space-4); list-style: none; }

.nav-links a {
  font-family: var(--font-display);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-text-primary);
  position: relative;
  padding: var(--space-1) 0;
}

.nav-links a::after {
  content: '';
  position: absolute;
  left: 0;
  bottom: -2px;
  width: 0;
  height: 2px;
  background: var(--color-accent-deep);
  transition: width var(--duration) var(--ease);
}

.nav-links a:hover::after,
.nav-links a[aria-current="page"]::after { width: 100%; }

.logo-mark {
  position: relative;
  width: 44px;
  height: 44px;
  flex-shrink: 0;
  min-width: 44px;
  min-height: 44px;
  border-radius: 50%;
  background:
    repeating-radial-gradient(
      circle at center,
      var(--color-accent-deep) 0px,
      var(--color-accent-deep) 3px,
      var(--color-accent-deep-shadow) 3px,
      var(--color-accent-deep-shadow) 4px
    );
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
  animation: logo-spin 9s linear infinite;
  transition: animation-duration 0.3s var(--ease);
}

.logo-mark__label {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 24px;
  height: 24px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--color-rose-deep);
  color: var(--color-bg);
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 700;
  font-size: 0.72rem;
  letter-spacing: 0.01em;
  transition: background 0.5s var(--ease), color 0.5s var(--ease);
}

.logo-mark__hole {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 3px;
  height: 3px;
  border-radius: 50%;
  background: var(--color-bg);
}

.logo-mark:hover { animation-duration: 0.9s; }
.logo-mark:hover .logo-mark__label { background: var(--color-rose); color: var(--color-accent-deep); }

@keyframes logo-spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

@media (prefers-reduced-motion: reduce) { .logo-mark { animation: none; } }

.logo-mark--sm {
  width: 26px;
  height: 26px;
  min-width: 26px;
  min-height: 26px;
  flex-shrink: 0;
  animation: none;
  transition: transform 0.6s var(--ease);
}
.logo-mark--sm:hover { animation: none; transform: rotate(360deg); }
.logo-mark--sm .logo-mark__label { width: 14px; height: 14px; font-size: 0.44rem; }

.logo-lockup__text { display: flex; flex-direction: column; gap: 0px; line-height: 1; }
.logo-lockup__name { font-family: var(--font-display); font-weight: 600; font-size: 1.05rem; color: var(--color-text-primary); }

.logo-lockup__tagline-wrap {
  display: inline-block;
  margin-left: 2px;
  overflow: hidden;
  height: 1em;
  line-height: 1;
  vertical-align: top;
}

.logo-lockup__tagline {
  display: inline-block;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.62rem;
  letter-spacing: 0.13em;
  text-transform: uppercase;
  color: #9E5A60;
  white-space: nowrap;
}

/* =========================================================
   Buttons / tags / section header: shared components
   ========================================================= */
.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  font-family: var(--font-display);
  font-weight: 500;
  font-size: var(--text-sm);
  padding: 0.75rem 1.5rem;
  border-radius: var(--radius-sm);
  border: 1px solid var(--color-text-primary);
  background: transparent;
  color: var(--color-text-primary);
  transition: background var(--duration) var(--ease), color var(--duration) var(--ease), transform var(--duration) var(--ease);
}
.btn:hover { background: var(--color-text-primary); color: var(--color-bg); transform: translateY(-2px); }
.btn--primary { background: var(--color-text-primary); color: var(--color-bg); }
.btn--primary:hover { background: var(--color-accent-deep); color: var(--color-white); }

.tag {
  display: inline-block;
  font-family: var(--font-body);
  font-size: var(--text-xs);
  font-weight: 600;
  padding: 0.3rem 0.8rem;
  border-radius: 999px;
  background: var(--color-accent-deep);
  color: var(--color-bg);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}

.section-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: var(--space-4);
  flex-wrap: wrap;
  gap: var(--space-2);
}
.section-header h2 { font-size: var(--text-xl); }
.section-header .eyebrow {
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 500;
  font-size: var(--text-sm);
  color: var(--color-rose-deep);
}

.reveal { opacity: 0; transform: translateY(24px); transition: opacity 0.7s var(--ease), transform 0.7s var(--ease); }
.reveal.is-visible { opacity: 1; transform: translateY(0); }

.site-footer {
  margin-top: var(--space-4);
  border-top: 1px solid rgba(36, 28, 24, 0.1);
  padding: var(--space-4) 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--space-2);
  color: var(--color-text-secondary);
  font-size: var(--text-sm);
}
.site-footer__brand { display: flex; align-items: center; gap: var(--space-2); }
.site-footer__links { display: flex; align-items: center; gap: var(--space-3); }
.site-footer__links a { transition: color var(--duration) var(--ease); }
.site-footer__links a:hover { color: var(--color-accent-deep); }

.email-choice { position: relative; display: inline-flex; }
.email-choice__menu {
  position: absolute;
  bottom: calc(100% + 10px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--color-bg);
  border: 1px solid rgba(46, 26, 20, 0.16);
  border-radius: var(--radius-sm);
  box-shadow: 0 16px 32px -16px rgba(46, 26, 20, 0.4);
  padding: 0.4rem;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  min-width: 168px;
  z-index: 60;
}
.email-choice__menu[hidden] { display: none; }
.email-choice__menu::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 6px solid transparent;
  border-top-color: var(--color-bg);
}
.email-choice__label {
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--color-text-secondary);
  padding: 0.3rem 0.5rem 0.15rem;
}
.email-choice__option {
  font-family: var(--font-body);
  font-size: var(--text-sm);
  text-align: left;
  padding: 0.45rem 0.6rem;
  border-radius: 4px;
  border: none;
  background: none;
  color: var(--color-text-primary);
  transition: background var(--duration) var(--ease), color var(--duration) var(--ease);
}
.email-choice__option:hover, .email-choice__option:focus-visible {
  background: var(--color-accent-deep);
  color: var(--color-bg);
  outline: none;
}

/* =========================================================
   Case study specific
   ========================================================= */
.cs-hero { padding-top: var(--space-6); padding-bottom: var(--space-4); }

.cs-hero .eyebrow {
  display: block;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--text-sm);
  color: var(--color-rose-deep);
  margin-bottom: var(--space-3);
}

.cs-hero h1 { font-size: clamp(2.1rem, 4.2vw, 4rem); max-width: 26ch; margin-bottom: var(--space-3); }

.cs-hero .dek {
  font-family: var(--font-secondary);
  font-size: var(--text-lg);
  color: #5B4C40;
  max-width: 58ch;
  margin-bottom: var(--space-3);
}

.nda-note {
  display: flex;
  gap: 0.55rem;
  align-items: center;
  background: var(--color-surface);
  border-radius: var(--radius-sm);
  padding: 0.6rem 1rem;
  max-width: 600px;
  margin-bottom: var(--space-5);
}
.nda-note__icon {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--color-accent-deep);
  color: var(--color-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 700;
  font-size: 0.68rem;
}
.nda-note p { margin: 0; font-size: 0.68rem; line-height: 1.5; color: var(--color-text-secondary); font-style: italic; }

.meta-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  column-gap: var(--space-4);
  row-gap: var(--space-2);
  border-top: 1px solid rgba(36, 28, 24, 0.12);
  padding-top: var(--space-4);
}
.meta-grid dt { font-family: var(--font-display); font-style: italic; font-size: var(--text-xs); color: var(--color-rose-deep); margin-bottom: 0.3rem; }
.meta-grid dd { margin: 0; font-size: var(--text-sm); }
.meta-grid .full-row { grid-column: 1 / -1; }

.jump-nav {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  margin-top: var(--space-3);
  padding-top: var(--space-2);
  border-top: 1px solid rgba(36, 28, 24, 0.12);
}
.jump-nav a {
  position: relative;
  font-family: var(--font-display);
  font-size: var(--text-sm);
  font-weight: 500;
  color: var(--color-text-secondary);
  padding: 0.4rem 0.1rem;
  transition: color var(--duration) var(--ease);
}
.jump-nav a::before {
  content: '';
  position: absolute;
  left: 0.1rem;
  right: 0.1rem;
  bottom: 0.15rem;
  height: 2px;
  background: var(--color-accent-deep);
  transform: scaleX(0);
  transform-origin: left;
  transition: transform var(--duration) var(--ease);
}
.jump-nav a:hover::before { transform: scaleX(1); }
.jump-nav a:not(:last-child)::after {
  content: '\00b7';
  display: inline-block;
  margin: 0 0.6rem;
  color: rgba(36, 28, 24, 0.3);
}
.jump-nav a:hover { color: var(--color-accent-deep); }

figure { margin: 0; }
figcaption {
  font-size: var(--text-xs);
  color: var(--color-text-secondary);
  margin-top: var(--space-2);
  max-width: 60ch;
}

/* Workshop photo gallery: small, cropped, editorial. A horizontal-scroll
   strip (same mechanics as the case-study carousel) rather than full-width
   blocks, so the photos sit inside the reading rhythm instead of stopping it. */
.photo-gallery { margin-top: var(--space-3); }
.photo-grid {
  display: flex;
  gap: var(--space-3);
  overflow-x: auto;
  overflow-anchor: none;
  scroll-snap-type: x mandatory;
  scroll-padding-left: var(--space-4);
  padding-bottom: var(--space-2);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--color-accent) transparent;
  -webkit-mask-image: linear-gradient(to right, transparent 0, black 40px, black calc(100% - 64px), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, black 40px, black calc(100% - 64px), transparent 100%);
}
.photo-grid.at-start { -webkit-mask-image: linear-gradient(to right, black 0, black calc(100% - 64px), transparent 100%); mask-image: linear-gradient(to right, black 0, black calc(100% - 64px), transparent 100%); }
.photo-grid.at-end { -webkit-mask-image: linear-gradient(to right, transparent 0, black 40px, black 100%); mask-image: linear-gradient(to right, transparent 0, black 40px, black 100%); }
.photo-grid.at-start.at-end { -webkit-mask-image: none; mask-image: none; }
.photo-grid::-webkit-scrollbar { height: 6px; }
.photo-grid::-webkit-scrollbar-track { background: transparent; }
.photo-grid::-webkit-scrollbar-thumb { background: var(--color-accent); border-radius: 999px; }

.photo-card {
  flex: 0 0 clamp(168px, 27vw, 218px);
  scroll-snap-align: start;
}
.photo-card__frame {
  aspect-ratio: 4 / 5;
  border-radius: var(--radius-sm);
  overflow: hidden;
  box-shadow: 0 14px 28px -18px rgba(36, 28, 24, 0.45);
}
.photo-card__frame img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photo-card figcaption {
  margin-top: 0.6rem;
  font-family: var(--font-secondary);
  font-style: italic;
  font-size: 0.78rem;
  line-height: 1.45;
  color: var(--color-text-secondary);
  max-width: none;
}

.section { padding-top: var(--space-6); padding-bottom: var(--space-6); border-top: 1px solid rgba(36, 28, 24, 0.08); scroll-margin-top: 90px; }
#overview.section { padding-top: var(--space-3); }
#prototype.section { padding-bottom: var(--space-3); }
#change-over-time.section { padding-top: var(--space-3); }

blockquote {
  margin: var(--space-4) 0;
  padding-left: var(--space-3);
  border-left: 3px solid var(--color-accent);
  font-family: var(--font-secondary);
  font-style: italic;
  font-size: var(--text-lg);
  color: var(--color-text-primary);
  max-width: 60ch;
}

.definition {
  display: flex;
  gap: var(--space-3);
  align-items: flex-start;
  background: var(--color-surface);
  border-radius: var(--radius-md);
  padding: var(--space-3) var(--space-4);
  margin: var(--space-4) 0;
}
.definition .term { font-family: var(--font-display); font-weight: 600; font-size: var(--text-base); white-space: nowrap; }
.definition p { margin: 0; font-size: var(--text-sm); color: var(--color-text-secondary); }
.sketch-note { position: absolute; top: -36px; right: 14px; display: flex; flex-direction: column; align-items: flex-end; pointer-events: none; }
.sketch-note__label { font-family: var(--font-secondary); font-style: italic; font-size: 0.85rem; color: var(--color-rose-deep); transform: rotate(-4deg); margin-bottom: 1px; }
@media (max-width: 640px) { .sketch-note { display: none; } }

.subsection { margin-bottom: var(--space-4); }
.subsection:last-child { margin-bottom: 0; }
.subsection h3 { font-size: var(--text-lg); margin-bottom: var(--space-2); }
.subsection p { font-size: var(--text-sm); color: var(--color-text-secondary); }

.reflection-block { background: var(--color-surface); border-radius: var(--radius-md); padding: var(--space-4); margin-bottom: var(--space-4); max-width: 760px; }
.reflection-block h3 { font-size: var(--text-lg); margin-bottom: var(--space-2); color: var(--color-accent-deep); }
.reflection-block p { font-size: var(--text-sm); margin: 0; color: var(--color-text-primary); }

/* --- Phase timeline --- */
.phase-timeline { position: relative; padding-left: 2rem; margin-top: var(--space-4); }
.phase-timeline::before {
  content: '';
  position: absolute;
  left: 5px;
  top: 6px;
  bottom: 6px;
  width: 1px;
  background: rgba(36, 28, 24, 0.15);
}
.phase { position: relative; padding-bottom: var(--space-4); }
.phase:last-child { padding-bottom: 0; }
.phase::before {
  content: '';
  position: absolute;
  left: -2rem;
  top: 4px;
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: var(--color-text-secondary);
  border: 2px solid var(--color-bg);
}
.phase--current::before { background: var(--color-rose-deep); }
.phase__label { font-size: var(--text-xs); font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--color-text-secondary); margin-bottom: 0.3rem; }
.phase h3 { font-size: var(--text-lg); margin-bottom: 0.5rem; }
.phase p { font-size: var(--text-sm); color: var(--color-text-secondary); max-width: 60ch; margin: 0; }
.phase__chips { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-top: 0.75rem; }
.phase__chip { font-size: var(--text-xs); padding: 0.3rem 0.75rem; border-radius: 999px; border: 1px solid rgba(36, 28, 24, 0.18); color: var(--color-text-secondary); }
.phase__chip--accent { border-color: var(--color-rose); color: var(--color-rose-deep); font-weight: 500; background: rgba(242, 227, 220, 0.5); }

.still-open { font-size: var(--text-sm); color: var(--color-text-secondary); max-width: 68ch; margin-top: var(--space-4); }
.still-open strong { color: var(--color-text-primary); }

/* --- Recreated product mockup ("tool-mock") ---
   A recreation of Dexter's actual interface, in the tool's own real
   branding (deep navy chrome, Travelers red for primary actions, cool
   blues for chat) rather than this portfolio's cream/brown palette,
   built from the original Figma designs, never a literal screenshot. */
.tool-mock {
  --tm-navy: #16283F;
  --tm-navy-deep: #0E1B2C;
  --tm-red: #A6192E;
  --tm-red-deep: #7E1121;
  --tm-blue-tint: #E4ECF6;
  --tm-blue-line: #B9C9DD;
  --tm-ink: #1C2530;
  --tm-muted: #66707C;
  --tm-hairline: rgba(22, 40, 63, 0.14);
  background: #FFFFFF;
  border: 1px solid var(--tm-hairline);
  border-radius: var(--radius-md);
  box-shadow: 0 28px 54px -30px rgba(22, 40, 63, 0.45);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  max-width: 380px;
  position: relative;
}
.tool-mock__header {
  background: var(--tm-navy);
  color: #F4F7FB;
  padding: 0.85rem 1rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.tool-mock__title {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: var(--text-base);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.tool-mock__spark { color: #E8A2AC; }
.tool-mock__badge {
  font-family: inherit;
  color: #F4F7FB;
  border: none;
  font-size: 0.65rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  background: rgba(244, 247, 251, 0.16);
  padding: 0.25rem 0.6rem;
  border-radius: 999px;
  cursor: pointer;
  transition: background var(--duration) var(--ease);
}
.tool-mock__badge:hover { background: rgba(244, 247, 251, 0.28); }
.tool-mock__trash {
  flex-shrink: 0;
  border: none;
  background: none;
  padding: 4px;
  color: var(--tm-muted);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: color var(--duration) var(--ease);
}
.tool-mock__trash:hover { color: var(--tm-red); }
.tool-mock__tabs { display: flex; border-bottom: 1px solid var(--tm-hairline); background: #F5F7FA; }
.tool-mock__tab { flex: 1; text-align: center; font-size: 0.72rem; font-weight: 600; padding: 0.6rem 0.35rem; color: var(--tm-muted); border-bottom: 2px solid transparent; transition: background var(--duration) var(--ease), color var(--duration) var(--ease); cursor: default; }
.tool-mock__tab--active { color: #FFFFFF; background: var(--tm-navy); border-bottom-color: var(--tm-red); }
.tool-mock__body { padding: 1rem; display: flex; flex-direction: column; min-height: 260px; color: var(--tm-ink); }
#heroBody { height: 480px; min-height: 0; overflow-y: auto; scroll-behavior: smooth; }
.tool-mock__panel { display: none; flex-direction: column; gap: 0.65rem; flex: 1; }
.tool-mock__panel.is-active { display: flex; }
.tool-mock__thread { display: flex; flex-direction: column; gap: 0.55rem; }
.tool-mock__composer {
  display: flex;
  align-items: center;
  gap: 0.4rem;
  border: 1px solid var(--tm-hairline);
  border-radius: 999px;
  padding: 0.5rem 0.4rem 0.5rem 0.85rem;
  margin-top: auto;
  background: #F5F7FA;
}
.tool-mock__composer-text { flex: 1; font-size: var(--text-sm); color: var(--tm-ink); white-space: nowrap; overflow: hidden; }
.tool-mock__composer--wrap { border-radius: 14px; align-items: flex-start; padding: 0.55rem 0.7rem; }
.tool-mock__composer--wrap .tool-mock__composer-text { white-space: normal; overflow: visible; line-height: 1.35; }
.tool-mock__caret { display: inline-block; width: 1px; height: 1em; background: var(--tm-ink); vertical-align: middle; animation: caret-blink 1s steps(1) infinite; }
@keyframes caret-blink { 50% { opacity: 0; } }
.tool-mock__send {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--tm-red);
  color: #fff;
  font-size: 0.7rem;
  flex-shrink: 0;
  transition: transform 0.2s var(--ease);
}
.tool-mock__send.is-active { transform: scale(1.18); }
.tool-mock__thinking { display: flex; align-items: center; gap: 0.4rem; font-size: var(--text-sm); color: var(--tm-muted); align-self: flex-start; padding: 0.2rem 0; }
.tool-mock__thinking-icon { display: inline-block; font-size: 0.85rem; color: var(--tm-red); animation: think-spark 1.1s ease-in-out infinite; }
@keyframes think-spark { 0%, 100% { opacity: 0.45; transform: scale(0.8) rotate(0deg); } 50% { opacity: 1; transform: scale(1.2) rotate(14deg); } }
.tool-mock__fade-in { animation: msg-fade-in 0.4s var(--ease); }
@keyframes msg-fade-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.tool-mock__lead { font-size: var(--text-sm); color: var(--tm-muted); }
.tool-mock__pins { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.tool-mock__pin { font-size: 0.68rem; padding: 0.25rem 0.6rem; border-radius: 999px; border: 1px solid var(--tm-blue-line); color: var(--tm-navy); background: var(--tm-blue-tint); }
.tool-mock__chip { font-size: var(--text-sm); border: 1px solid var(--tm-hairline); border-radius: 999px; padding: 0.5rem 0.9rem; color: var(--tm-navy); align-self: flex-start; background: #F5F7FA; }
.tool-mock__insight { border: 1px solid var(--tm-blue-line); border-left: 3px solid var(--tm-navy); border-radius: 8px; padding: 0.7rem 0.85rem; background: var(--tm-blue-tint); }
.tool-mock__insight strong { display: block; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--tm-navy); margin-bottom: 0.4rem; }
.tool-mock__insight ul { list-style: none; font-size: var(--text-sm); color: var(--tm-ink); display: flex; flex-direction: column; gap: 0.25rem; }
.tool-mock__insight li::before { content: '· '; color: var(--tm-red); font-weight: 700; }
.tool-mock__msg { font-size: var(--text-sm); border-radius: 10px; padding: 0.6rem 0.8rem; max-width: 90%; }
.tool-mock__msg--user { align-self: flex-end; background: var(--tm-blue-tint); color: var(--tm-ink); }
.tool-mock__msg--bot { align-self: flex-start; border: 1px solid var(--tm-hairline); color: var(--tm-ink); }
.tool-mock__sources { display: flex; gap: 0.4rem; flex-wrap: wrap; }
.tool-mock__source { font-size: 0.65rem; font-weight: 600; padding: 0.22rem 0.6rem; border-radius: 999px; background: var(--tm-blue-tint); color: var(--tm-navy); text-decoration: none; transition: background var(--duration) var(--ease); }
.tool-mock__source:hover { background: var(--tm-blue-line); }
.tool-mock__suggest { display: flex; align-items: center; gap: 0.55rem; border: 1px solid var(--tm-blue-line); background: var(--tm-blue-tint); border-radius: 10px; padding: 0.6rem 0.7rem; }
.tool-mock__suggest svg { flex-shrink: 0; color: var(--tm-navy); }
.tool-mock__suggest-text { display: flex; flex-direction: column; gap: 0.1rem; flex: 1; min-width: 0; }
.tool-mock__suggest-text strong { font-size: 0.78rem; font-weight: 600; color: var(--tm-navy); }
.tool-mock__suggest-text span { font-size: 0.67rem; color: var(--tm-muted); }
.tool-mock__suggest-btn { flex-shrink: 0; font-family: var(--font-body); font-weight: 600; font-size: 0.72rem; color: #fff; background: var(--tm-red); border: none; border-radius: 999px; padding: 0.38rem 0.8rem; cursor: pointer; transition: background var(--duration) var(--ease); }
.tool-mock__suggest-btn:hover { background: var(--tm-red-deep); }
.tool-mock__artifact { border: 1px solid var(--tm-hairline); border-radius: 8px; padding: 0.65rem 0.8rem; display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; }
.tool-mock__artifact strong { display: flex; align-items: center; gap: 0.4rem; font-size: var(--text-sm); font-weight: 600; color: var(--tm-ink); }
.tool-mock__artifact span { font-size: 0.68rem; color: var(--tm-muted); }
.tool-mock__artifact a { font-size: 0.75rem; font-weight: 600; color: var(--tm-red); text-decoration: underline; flex-shrink: 0; }
.tool-mock__filetag { display: inline-flex; align-items: center; justify-content: center; font-size: 0.63rem; font-weight: 800; letter-spacing: 0.02em; padding: 0.15rem 0.42rem; border-radius: 4px; flex-shrink: 0; }
.tool-mock__filetag--xlsx { background: #DCEEE3; color: #106B3E; }
.tool-mock__filetag--pptx { background: #F5DFDA; color: var(--tm-red-deep); }
.tool-mock__filetag--pdf { background: var(--tm-blue-tint); color: var(--tm-navy-deep); }
.tool-mock__folder + .tool-mock__folder { margin-top: 0.15rem; padding-top: 0.7rem; border-top: 1px solid var(--tm-hairline); }
.tool-mock__folder-head { display: flex; align-items: center; gap: 0.4rem; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--tm-navy); margin-bottom: 0.5rem; }
.tool-mock__folder-head svg { flex-shrink: 0; color: var(--tm-muted); }
.tool-mock__folder-count { margin-left: auto; font-size: 0.63rem; font-weight: 600; letter-spacing: 0; text-transform: none; color: var(--tm-muted); background: var(--tm-blue-tint); border-radius: 999px; padding: 0.05rem 0.45rem; }
.tool-mock__folder-items { padding-left: 1.1rem; border-left: 1px solid var(--tm-hairline); margin-left: 0.3rem; }
.tool-mock__meta { display: flex; align-items: center; gap: 0.4rem; font-size: 0.68rem; color: var(--tm-muted); }
.tool-mock__meta-dot { width: 6px; height: 6px; border-radius: 50%; background: #2E8B57; flex-shrink: 0; }
.tool-mock__meta-dot--muted { background: var(--tm-muted); }
.tool-mock__next { display: flex; align-items: center; gap: 0.3rem; font-size: 0.72rem; font-weight: 600; color: var(--tm-red); text-decoration: none; }
.tool-mock__next svg { flex-shrink: 0; }
.tool-mock__next:hover { text-decoration: underline; }
.tool-mock__badge-new { display: inline-block; font-size: 0.56rem; font-weight: 700; letter-spacing: 0.03em; color: var(--tm-red); border: 1px solid var(--tm-red); border-radius: 999px; padding: 0.03rem 0.38rem; margin-left: 0.4rem; text-decoration: none; vertical-align: middle; }
.tool-mock__receipt { display: flex; align-items: center; gap: 0.3rem; align-self: flex-end; font-size: 0.62rem; color: var(--tm-muted); }
.tool-mock__receipt svg { flex-shrink: 0; color: #2E8B57; }
.tool-mock__list { list-style: none; font-size: var(--text-sm); display: flex; flex-direction: column; gap: 0.5rem; }
.tool-mock__list a { color: var(--tm-navy); text-decoration: underline; }
.tool-mock__list--meta a { display: flex; flex-direction: column; gap: 0.15rem; text-decoration: none; }
.tool-mock__list--meta strong { font-weight: 600; text-decoration: underline; }
.tool-mock__list--meta span { font-size: 0.72rem; font-weight: 400; color: var(--tm-muted); }
.tool-mock__radio { display: flex; align-items: flex-start; gap: 0.5rem; font-size: var(--text-sm); padding: 0.5rem 0; border-bottom: 1px solid var(--tm-hairline); color: var(--tm-ink); }
.tool-mock__radio:last-child { border-bottom: none; }
.tool-mock__radio-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--tm-navy); flex-shrink: 0; margin-top: 2px; position: relative; }
.tool-mock__radio--active .tool-mock__radio-dot::after { content: ''; position: absolute; inset: 2px; border-radius: 50%; background: var(--tm-navy); }
.tool-mock__radio small { display: block; color: var(--tm-muted); font-size: 0.75rem; margin-top: 0.15rem; }
.tool-mock__footer { padding: 0.75rem 1rem; border-top: 1px solid var(--tm-hairline); }
.tool-mock__cta {
  display: block;
  width: 100%;
  text-align: center;
  background: var(--tm-red);
  color: #FFFFFF;
  font-family: var(--font-body);
  font-weight: 600;
  font-size: var(--text-sm);
  padding: 0.65rem;
  border-radius: var(--radius-sm);
  border: none;
  transition: background var(--duration) var(--ease);
}
.tool-mock__cta:hover { background: var(--tm-red-deep); }

/* Fake cursor: a real pointer-arrow shape (not a shape approximation)
   that actually drives the mockup, clicking tabs and typing a message,
   so it reads like a captured screen recording rather than a still
   frame with something decorative floating over it. */
.tool-mock__cursor {
  position: absolute;
  z-index: 6;
  width: 18px;
  height: 18px;
  pointer-events: none;
  left: 40px;
  top: 40px;
  opacity: 0;
  transition: left 1.5s cubic-bezier(0.65, 0, 0.35, 1), top 1.5s cubic-bezier(0.65, 0, 0.35, 1), opacity 0.3s ease;
  filter: drop-shadow(0 2px 3px rgba(14, 27, 44, 0.4));
}
.tool-mock__cursor.is-active { opacity: 1; }
.tool-mock__cursor svg { display: block; }
.tool-mock__click {
  position: absolute;
  left: 3px;
  top: 3px;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--tm-red);
  opacity: 0;
  transform: scale(0.4);
  pointer-events: none;
}
.tool-mock__click.is-clicking { animation: click-ripple 0.45s ease-out; }
@keyframes click-ripple {
  0% { opacity: 0.55; transform: scale(0.4); }
  100% { opacity: 0; transform: scale(2.4); }
}

.tool-quad-controls { display: flex; justify-content: flex-end; margin-top: var(--space-4); margin-bottom: var(--space-2); }
.tool-quad {
  display: flex;
  gap: var(--space-3);
  overflow-x: auto;
  overflow-anchor: none;
  scroll-snap-type: x mandatory;
  scroll-padding-left: var(--space-4);
  padding-bottom: var(--space-2);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--color-accent) transparent;
  -webkit-mask-image: linear-gradient(to right, transparent 0, black 40px, black calc(100% - 64px), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, black 40px, black calc(100% - 64px), transparent 100%);
}
.tool-quad.at-start { -webkit-mask-image: linear-gradient(to right, black 0, black calc(100% - 64px), transparent 100%); mask-image: linear-gradient(to right, black 0, black calc(100% - 64px), transparent 100%); }
.tool-quad.at-end { -webkit-mask-image: linear-gradient(to right, transparent 0, black 40px, black 100%); mask-image: linear-gradient(to right, transparent 0, black 40px, black 100%); }
.tool-quad.at-start.at-end { -webkit-mask-image: none; mask-image: none; }
.tool-quad::-webkit-scrollbar { height: 6px; }
.tool-quad::-webkit-scrollbar-track { background: transparent; }
.tool-quad::-webkit-scrollbar-thumb { background: var(--color-accent); border-radius: 999px; }
.tool-quad .tool-mock--sm { flex: 0 0 clamp(230px, 42vw, 290px); scroll-snap-align: start; max-width: none; }
.tool-mock--sm .tool-mock__body { min-height: 170px; padding: 0.85rem; gap: 0.5rem; }
.tool-mock--sm .tool-mock__header { padding: 0.65rem 0.8rem; }
.tool-mock--sm .tool-mock__title { font-size: var(--text-sm); }
.tool-mock--sm .tool-mock__lead { font-size: 0.78rem; }
.tool-mock--sm .tool-mock__composer-text { font-size: 0.78rem; }
.tool-mock--sm .tool-mock__artifact strong, .tool-mock--sm .tool-mock__artifact span { font-size: 0.78rem; }
.tool-mock--sm .tool-mock__insight { padding: 0.55rem 0.65rem; }
.tool-mock--sm .tool-mock__insight ul { font-size: 0.76rem; }
.tool-mock--sm .tool-mock__chip { font-size: 0.75rem; padding: 0.4rem 0.7rem; }
.tool-mock--sm .tool-mock__list { font-size: 0.78rem; gap: 0.35rem; }
.tool-mock--sm .tool-mock__meta { font-size: 0.65rem; }
.tool-mock--sm .tool-mock__next { font-size: 0.7rem; }
.tool-mock--sm .tool-mock__folder-head { font-size: 0.63rem; margin-bottom: 0.4rem; }
.tool-mock--sm .tool-mock__folder-items { font-size: 0.76rem; gap: 0.35rem; }
.tool-mock--sm .tool-mock__filetag { font-size: 0.58rem; padding: 0.14rem 0.38rem; }
.tool-mock--sm .tool-mock__receipt { font-size: 0.6rem; }

/* --- Before / after comparison grid --- */
.compare-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--space-3); margin-top: var(--space-4); }
@media (max-width: 860px) { .compare-grid { grid-template-columns: 1fr; } }
.compare-card { background: var(--color-surface); border-radius: var(--radius-sm); padding: var(--space-3); }
.compare-card h4 { font-family: var(--font-display); font-size: var(--text-base); font-weight: 600; margin-bottom: 0.75rem; }
.compare-row { display: flex; gap: 0.6rem; align-items: center; margin-bottom: 0.5rem; }
.compare-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--color-text-secondary); width: 46px; flex-shrink: 0; }
.compare-swatch { flex: 1; background: var(--color-bg); border: 1px solid rgba(36, 28, 24, 0.15); border-radius: 6px; padding: 0.4rem 0.6rem; font-size: 0.72rem; color: var(--color-text-secondary); }
.compare-swatch--after { border-color: var(--color-accent-deep); color: var(--color-accent-deep); font-weight: 600; }
.compare-card p { font-size: var(--text-xs); color: var(--color-text-secondary); margin: 0.5rem 0 0; }

.next-recommend {
  display: flex;
  gap: 0.7rem;
  align-items: flex-start;
  background: var(--color-surface);
  border-radius: var(--radius-sm);
  padding: var(--space-3);
  max-width: 640px;
  margin: var(--space-3) 0 var(--space-4);
}
.next-recommend__icon {
  flex-shrink: 0;
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--color-accent-deep);
  color: var(--color-bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.85rem;
}
.next-recommend p { margin: 0; font-size: var(--text-sm); color: var(--color-text-primary); }
.next-recommend strong { color: var(--color-accent-deep); }

.card-carousel-controls { display: flex; justify-content: flex-end; margin-bottom: var(--space-2); }
.card-nav { display: flex; gap: var(--space-1); }
.card-nav__btn {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  flex-shrink: 0;
  border-radius: 50%;
  border: 1px solid rgba(36, 28, 24, 0.2);
  background: var(--color-bg);
  color: var(--color-accent-deep);
  transition: background var(--duration) var(--ease), color var(--duration) var(--ease), border-color var(--duration) var(--ease), opacity var(--duration) var(--ease);
}
.card-nav__btn:hover:not(:disabled) { background: var(--color-accent-deep); color: var(--color-bg); border-color: var(--color-accent-deep); }
.card-nav__btn:disabled { opacity: 0.32; }

.card-grid {
  display: flex;
  align-items: flex-start;
  gap: var(--space-4);
  overflow-x: auto;
  overflow-anchor: none;
  scroll-snap-type: x mandatory;
  scroll-padding-left: var(--space-4);
  padding-top: var(--space-3);
  padding-bottom: var(--space-3);
  margin-top: var(--space-4);
  -webkit-overflow-scrolling: touch;
  scrollbar-width: thin;
  scrollbar-color: var(--color-accent) transparent;
  -webkit-mask-image: linear-gradient(to right, transparent 0, black 40px, black calc(100% - 64px), transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, black 40px, black calc(100% - 64px), transparent 100%);
}
.card-grid.at-start { -webkit-mask-image: linear-gradient(to right, black 0, black calc(100% - 64px), transparent 100%); mask-image: linear-gradient(to right, black 0, black calc(100% - 64px), transparent 100%); }
.card-grid.at-end { -webkit-mask-image: linear-gradient(to right, transparent 0, black 40px, black 100%); mask-image: linear-gradient(to right, transparent 0, black 40px, black 100%); }
.card-grid.at-start.at-end { -webkit-mask-image: none; mask-image: none; }
.card-grid::-webkit-scrollbar { height: 7px; }
.card-grid::-webkit-scrollbar-track { background: transparent; }
.card-grid::-webkit-scrollbar-thumb { background: var(--color-accent); border-radius: 999px; }

.project-card {
  display: block;
  flex: 0 0 clamp(260px, 60vw, 360px);
  scroll-snap-align: start;
  border-radius: var(--radius-sm);
  overflow: hidden;
  border: 1px solid rgba(36, 28, 24, 0.14);

<script>
document.addEventListener('DOMContentLoaded', () => {
  // Scroll-triggered reveal
  const revealEls = document.querySelectorAll('.reveal');
  if ('IntersectionObserver' in window && revealEls.length) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('is-visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.1 });
    revealEls.forEach((el) => observer.observe(el));
  } else {
    revealEls.forEach((el) => el.classList.add('is-visible'));
  }

  // Horizontal-scroll carousels (the "Keep exploring" cards and the
  // workshop photo strip): prev/next buttons scroll by one item width
  // (measured live). Native drag/swipe/trackpad scroll keeps working
  // untouched; this is just a shortcut for it.
  function setupCarousel(grid, prevBtn, nextBtn, itemSelector) {
    if (!grid || !prevBtn || !nextBtn) return;
    const scrollByItem = (dir) => {
      const item = grid.querySelector(itemSelector);
      const gap = parseFloat(getComputedStyle(grid).columnGap || getComputedStyle(grid).gap) || 0;
      const amount = item ? item.getBoundingClientRect().width + gap : grid.clientWidth * 0.8;
      grid.scrollBy({ left: amount * dir, behavior: 'smooth' });
    };
    prevBtn.addEventListener('click', () => scrollByItem(-1));
    nextBtn.addEventListener('click', () => scrollByItem(1));
    const updateEdges = () => {
      const atStart = grid.scrollLeft <= 4;
      const atEnd = grid.scrollLeft >= grid.scrollWidth - grid.clientWidth - 4;
      prevBtn.disabled = atStart;
      nextBtn.disabled = atEnd;
      grid.classList.toggle('at-start', atStart);
      grid.classList.toggle('at-end', atEnd);
    };
    grid.addEventListener('scroll', updateEdges, { passive: true });
    window.addEventListener('resize', updateEdges);
    updateEdges();
  }

  setupCarousel(document.querySelector('.card-grid'), document.getElementById('cardNavPrev'), document.getElementById('cardNavNext'), '.project-card');
  setupCarousel(document.getElementById('photoGrid'), document.getElementById('photoNavPrev'), document.getElementById('photoNavNext'), '.photo-card');
  setupCarousel(document.getElementById('quadGrid'), document.getElementById('quadNavPrev'), document.getElementById('quadNavNext'), '.tool-mock--sm');

  // Hero prototype demo: a real pointer clicks through the tabs, then
  // types a question into the composer, waits through a "thinking"
  // state, and a response fades in. Reads like a screen recording of
  // the working prototype rather than a static mockup. Skips entirely
  // under prefers-reduced-motion, leaving the static chat view in place.
  (function heroDemo() {
    const mock = document.getElementById('heroMock');
    if (!mock) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const cursor = document.getElementById('heroCursor');
    const clickDot = document.getElementById('heroClick');
    const heroBody = document.getElementById('heroBody');
    const thread = document.getElementById('heroThread');
    const composer = document.getElementById('heroComposer');
    const composerInner = document.getElementById('heroComposerTextInner');
    const sendBtn = document.getElementById('heroSendBtn');
    const badge = document.getElementById('heroBadge');
    const tabs = {
      chat: document.getElementById('heroTabChat'),
      history: document.getElementById('heroTabHistory'),
      artifacts: document.getElementById('heroTabArtifacts'),
      guidance: document.getElementById('heroTabGuidance'),
    };
    const panels = {
      chat: document.getElementById('heroPanelChat'),
      history: document.getElementById('heroPanelHistory'),
      artifacts: document.getElementById('heroPanelArtifacts'),
      guidance: document.getElementById('heroPanelGuidance'),
      pinned: document.getElementById('heroPanelPinned'),
    };
    if (!cursor || !thread || !composer || !composerInner || !sendBtn) return;

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function scrollToBottom() {
      if (!heroBody) return;
      heroBody.scrollTo({ top: heroBody.scrollHeight, behavior: 'smooth' });
    }

    function moveCursorTo(el, offsetX, offsetY) {
      const mockRect = mock.getBoundingClientRect();
      const elRect = el.getBoundingClientRect();
      cursor.style.left = `${elRect.left - mockRect.left + offsetX}px`;
      cursor.style.top = `${elRect.top - mockRect.top + offsetY}px`;
      cursor.classList.add('is-active');
    }

    function clickPulse() {
      clickDot.classList.remove('is-clicking');
      void clickDot.offsetWidth;
      clickDot.classList.add('is-clicking');
    }

    // Pinned has no tab of its own: it opens from the badge instead,
    // so only the tab bar's own entries get an active state here.
    function switchTab(name) {
      Object.keys(tabs).forEach((key) => {
        tabs[key].classList.toggle('tool-mock__tab--active', key === name);
      });
      Object.keys(panels).forEach((key) => {
        panels[key].classList.toggle('is-active', key === name);
      });
      if (heroBody) heroBody.scrollTop = 0;
    }

    if (badge) {
      badge.addEventListener('click', () => switchTab('pinned'));
    }

    async function typeText(el, text, speed) {
      el.textContent = '';
      for (let i = 0; i < text.length; i += 1) {
        el.textContent += text[i];
        await wait(speed);
      }
    }

    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `tool-mock__msg tool-mock__msg--${role} tool-mock__fade-in`;
      msg.textContent = text;
      thread.appendChild(msg);
    }

    // Bot replies carry more than a sentence: where the answer came
    // from (a real link back into the source system), plus a separate
    // prompt, a beat later, offering to add the finding straight into
    // the report already in progress rather than leaving it to be
    // copied over by hand.
    function appendBotMessage(turn) {
      const msg = document.createElement('div');
      msg.className = 'tool-mock__msg tool-mock__msg--bot tool-mock__fade-in';
      msg.style.display = 'flex';
      msg.style.flexDirection = 'column';
      msg.style.gap = '0.55rem';

      const p = document.createElement('p');
      p.style.margin = '0';
      p.textContent = turn.a;
      msg.appendChild(p);

      if (turn.sources && turn.sources.length) {
        const sources = document.createElement('div');
        sources.className = 'tool-mock__sources';
        turn.sources.forEach((source) => {
          const link = document.createElement('a');
          link.href = source.href || '#';
          link.className = 'tool-mock__source';
          link.textContent = source.label;
          sources.appendChild(link);
        });
        msg.appendChild(sources);
      }
      thread.appendChild(msg);
    }

    function appendReportSuggestion(turn) {
      if (!turn.report) return;
      const sourceLabel = turn.sources && turn.sources[0] ? turn.sources[0].label : 'this conversation';
      const suggest = document.createElement('div');
      suggest.className = 'tool-mock__suggest tool-mock__fade-in';
      suggest.innerHTML = `
        <svg width="15" height="15" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><rect x="1.5" y="1.5" width="11" height="11" rx="2.5" stroke="currentColor" stroke-width="1.2"/><path d="M7 4.4v5.2M4.4 7h5.2" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
        <div class="tool-mock__suggest-text"><strong>Add to ${turn.report}</strong><span>Found in ${sourceLabel}</span></div>
        <button type="button" class="tool-mock__suggest-btn">Add</button>
      `;
      thread.appendChild(suggest);
    }

    const TURNS = [
      {
        q: 'What changed on this account since renewal?',
        a: 'Payroll grew 12% and one new location was added in Ohio. Loss history is unchanged.',
        sources: [{ label: 'Payroll audit, PolicyCenter', href: '#' }],
        report: 'Renewal briefing',
      },
      {
        q: 'Any red flags before I send this to the underwriter?',
        a: 'None in the loss run. The updated payroll figure is documented and within appetite.',
        sources: [
          { label: 'Loss runs, PolicyCenter', href: '#' },
          { label: 'Underwriting guidelines', href: '#' },
        ],
        report: 'Renewal briefing',
      },
    ];
    let turnIndex = 0;

    async function runTabTour() {
      const order = ['history', 'artifacts', 'guidance', 'pinned', 'chat'];
      for (let i = 0; i < order.length; i += 1) {
        const name = order[i];
        const target = name === 'pinned' ? badge : tabs[name];
        if (!target) continue;
        moveCursorTo(target, 12, 10);
        await wait(1550);
        clickPulse();
        switchTab(name);
        await wait(1300);
      }
    }

    async function runComposerTurn() {
      const turn = TURNS[turnIndex % TURNS.length];
      turnIndex += 1;

      moveCursorTo(composer, 24, 12);
      await wait(1550);
      await typeText(composerInner, turn.q, 36);
      scrollToBottom();
      await wait(650);

      moveCursorTo(sendBtn, 10, 10);
      await wait(1550);
      sendBtn.classList.add('is-active');
      clickPulse();
      await wait(250);
      sendBtn.classList.remove('is-active');

      thread.innerHTML = '';
      appendMessage('user', turn.q);
      composerInner.textContent = '';
      scrollToBottom();

      const thinking = document.createElement('div');
      thinking.className = 'tool-mock__thinking';
      thinking.innerHTML = '<span class="tool-mock__thinking-icon" aria-hidden="true">&#10022;</span> Dexter is thinking';
      thread.appendChild(thinking);
      scrollToBottom();
      await wait(1650);
      thinking.remove();

      appendBotMessage(turn);
      scrollToBottom();
      await wait(700);

      appendReportSuggestion(turn);
      scrollToBottom();
      await wait(2600);
    }

    async function runDemo() {
      cursor.classList.add('is-active');
      for (;;) {
        await wait(1400);
        await runTabTour();
        await runComposerTurn();
      }
    }

    if ('IntersectionObserver' in window) {
      const heroObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            heroObserver.disconnect();
            runDemo();
          }
        });
      }, { threshold: 0.4 });
      heroObserver.observe(mock);
    } else {
      runDemo();
    }
  })();

  // Prototype carousel mocks: a single small pointer gesture per card
  // (move in, click), run one card at a time as it becomes the card
  // most in view. Because the cards live in a horizontal carousel
  // rather than a grid, only one is ever centered in the viewport at
  // once, so the gestures play in sequence as the visitor scrolls
  // rather than all firing together.
  (function quadGestures() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const gestures = [
      { mock: 'quadChat', cursor: 'quadCursorChat', click: 'quadClickChat', target: 'quadTargetChat' },
      { mock: 'quadGuide', cursor: 'quadCursorGuide', click: 'quadClickGuide', target: 'quadTargetGuide' },
      { mock: 'quadProject', cursor: 'quadCursorProject', click: 'quadClickProject', target: 'quadTargetProject' },
      { mock: 'quadArchive', cursor: 'quadCursorArchive', click: 'quadClickArchive', target: 'quadTargetArchive' },
      { mock: 'quadShare', cursor: 'quadCursorShare', click: 'quadClickShare', target: 'quadTargetShare' },
      { mock: 'quadSettings', cursor: 'quadCursorSettings', click: 'quadClickSettings', target: 'quadTargetSettings' },
    ];
    if (!('IntersectionObserver' in window)) return;

    let played = false;
    let playing = false;

    function playGesture({ mock: mockId, cursor: cursorId, click: clickId, target: targetId }) {
      const mockEl = document.getElementById(mockId);
      const cursorEl = document.getElementById(cursorId);
      const clickEl = document.getElementById(clickId);
      const targetEl = document.getElementById(targetId);
      if (!mockEl || !cursorEl || !clickEl || !targetEl) return;
      const mockRect = mockEl.getBoundingClientRect();
      const targetRect = targetEl.getBoundingClientRect();
      cursorEl.style.left = `${targetRect.left - mockRect.left + 12}px`;
      cursorEl.style.top = `${targetRect.top - mockRect.top + 8}px`;
      cursorEl.classList.add('is-active');
      setTimeout(() => {
        clickEl.classList.remove('is-clicking');
        void clickEl.offsetWidth;
        clickEl.classList.add('is-clicking');
      }, 1500);
      setTimeout(() => { cursorEl.classList.remove('is-active'); }, 2500);
    }

    // Play the first card's gesture once the carousel first scrolls
    // into view, then replay it on the single card most centered in
    // the viewport whenever the visitor scrolls the strip.
    const centerObserver = new IntersectionObserver((entries) => {
      if (playing) return;
      const visible = entries.filter((e) => e.isIntersecting);
      if (!visible.length) return;
      const mostCentered = visible.reduce((a, b) => (b.intersectionRatio > a.intersectionRatio ? b : a));
      const match = gestures.find((g) => g.mock === mostCentered.target.id);
      if (!match) return;
      playing = true;
      played = true;
      playGesture(match);
      setTimeout(() => { playing = false; }, 3200);
    }, { threshold: [0.6, 0.8, 0.95] });

    gestures.forEach((g) => {
      const el = document.getElementById(g.mock);
      if (el) centerObserver.observe(el);
    });

    // Kick off the very first gesture as soon as the strip is reachable.
    const startObserver = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting && !played) {
          startObserver.disconnect();
          setTimeout(() => { if (!played) { playing = true; played = true; playGesture(gestures[0]); setTimeout(() => { playing = false; }, 3200); } }, 500);
        }
      });
    }, { threshold: 0.5 });
    const firstMock = document.getElementById('quadChat');
    if (firstMock) startObserver.observe(firstMock);
  })();

  // Chat carousel card: a small looping typing animation in its
  // composer so the first card reads as live rather than static.
  (function quadChatTyping() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const inner = document.getElementById('quadChatComposerInner');
    if (!inner) return;
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
    const QUESTIONS = [
      'How has this customer changed over time?',
      'Any red flags before I send this to the underwriter?',
    ];
    let i = 0;

    async function typeOnce(text) {
      inner.textContent = '';
      for (let c = 0; c < text.length; c += 1) {
        inner.textContent += text[c];
        await wait(42);
      }
      await wait(1700);
      for (let c = text.length; c > 0; c -= 1) {
        inner.textContent = text.slice(0, c - 1);
        await wait(16);
      }
      await wait(500);
    }

    async function loop() {
      for (;;) {
        await typeOnce(QUESTIONS[i % QUESTIONS.length]);
        i += 1;
      }
    }

    if ('IntersectionObserver' in window) {
      const obs = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            obs.disconnect();
            loop();
          }
        });
      }, { threshold: 0.4 });
      const card = document.getElementById('quadChat');
      if (card) obs.observe(card);
    } else {
      loop();
    }
  })();

  // Jump nav: scroll explicitly rather than relying on default anchor
  // behavior, so it works the same regardless of how the page is hosted.
  document.querySelectorAll('.jump-nav a').forEach((link) => {
    link.addEventListener('click', (e) => {
      const id = link.getAttribute('href').slice(1);
      const target = document.getElementById(id);
      if (!target) return;
      e.preventDefault();
      target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  // Mark current nav link
  const path = window.location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('.nav-links a').forEach((link) => {
    const href = link.getAttribute('href');
    if (href === path) {
      link.setAttribute('aria-current', 'page');
    } else {
      link.removeAttribute('aria-current');
    }
  });

  // Footer "Email" link: ask which mail app to use instead of silently
  // handing off to the OS default. Keeps a real mailto: href underneath.
  const EMAIL_ADDRESS = 'elizabethkindt.design@gmail.com';
  const EMAIL_SUBJECT = 'Hello From Your Portfolio';
  const emailTrigger = document.getElementById('emailTrigger');
  const emailMenu = document.getElementById('emailMenu');

  if (emailTrigger && emailMenu) {
    const closeMenu = () => {
      emailMenu.hidden = true;
      emailTrigger.setAttribute('aria-expanded', 'false');
    };

    emailTrigger.addEventListener('click', (e) => {
      if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
      e.preventDefault();
      const isHidden = emailMenu.hidden;
      emailMenu.hidden = !isHidden;
      emailTrigger.setAttribute('aria-expanded', String(isHidden));
    });

    emailMenu.querySelectorAll('.email-choice__option').forEach((btn) => {
      btn.addEventListener('click', () => {
        const provider = btn.dataset.provider;
        const url = provider === 'gmail'
          ? `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(EMAIL_ADDRESS)}&su=${encodeURIComponent(EMAIL_SUBJECT)}`
          : `https://outlook.office.com/mail/deeplink/compose?to=${encodeURIComponent(EMAIL_ADDRESS)}&subject=${encodeURIComponent(EMAIL_SUBJECT)}`;
        window.open(url, '_blank', 'noopener');
        closeMenu();
      });
    });

    document.addEventListener('click', (e) => {
      if (!emailMenu.hidden && e.target !== emailTrigger && !emailMenu.contains(e.target)) {
        closeMenu();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !emailMenu.hidden) {
        closeMenu();
        emailTrigger.focus();
      }
    });
  }
});
</script><script>
  // Hero chat mock: a lighter companion to the Complete Prototype below.
  // Only the Chat tab animates here (History/Artifacts/Guidance are shown
  // for context but static) since the full tab tour already lives in the

  (function heroChatDemo() {
    const mock = document.getElementById('heroChatMock');
    if (!mock) return;
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const cursor = document.getElementById('heroChatCursor');
    const clickDot = document.getElementById('heroChatClick');
    const body = document.getElementById('heroChatBody');
    const thread = document.getElementById('heroChatThread');
    const composer = document.getElementById('heroChatComposer');
    const composerInner = document.getElementById('heroChatComposerInner');
    const sendBtn = document.getElementById('heroChatSendBtn');
    if (!cursor || !thread || !composer || !composerInner || !sendBtn) return;

    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

    function scrollToBottom() {
      if (!body) return;
      body.scrollTo({ top: body.scrollHeight, behavior: 'smooth' });
    }

    function moveCursorTo(el, offsetX, offsetY) {
      const mockRect = mock.getBoundingClientRect();
      const elRect = el.getBoundingClientRect();
      cursor.style.left = `${elRect.left - mockRect.left + offsetX}px`;
      cursor.style.top = `${elRect.top - mockRect.top + offsetY}px`;
      cursor.classList.add('is-active');
    }

    function clickPulse() {
      clickDot.classList.remove('is-clicking');
      void clickDot.offsetWidth;
      clickDot.classList.add('is-clicking');
    }

    async function typeText(el, text, speed) {
      el.textContent = '';
      for (let i = 0; i < text.length; i += 1) {
        el.textContent += text[i];
        await wait(speed);
      }
    }

    function appendMessage(role, text) {
      const msg = document.createElement('div');
      msg.className = `tool-mock__msg tool-mock__msg--${role} tool-mock__fade-in`;
      msg.textContent = text;
      thread.appendChild(msg);
    }

    const cursorIcon = document.getElementById('heroChatCursorIcon');
    const ARROW_ICON = '<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 1.5L2 14.8L5.6 11.6L7.8 16.3L9.9 15.3L7.8 10.6L12.2 10.2L2 1.5Z" fill="#FFFFFF" stroke="#1C2530" stroke-width="1.1" stroke-linejoin="round"/></svg>';
    const TEXT_ICON = '<svg width="14" height="20" viewBox="0 0 14 20" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M3 1.5h8M3 18.5h8M7 1.5v17" stroke="#1C2530" stroke-width="1.6" stroke-linecap="round"/></svg>';

    function setCursorTyping(isTyping) {
      if (!cursorIcon) return;
      cursorIcon.innerHTML = isTyping ? TEXT_ICON : ARROW_ICON;
    }

    const TURN = {
      q: 'Is there anything here the underwriter should see first?',
      a: 'The updated payroll figure and the new Ohio location. Both are already noted in the loss run.',
      source: 'OneTrav',
      next: 'Add this to the renewal briefing',
    };

    function appendBotReply() {
      const msg = document.createElement('div');
      msg.className = 'tool-mock__msg tool-mock__msg--bot tool-mock__fade-in';
      msg.style.display = 'flex';
      msg.style.flexDirection = 'column';
      msg.style.gap = '0.5rem';

      const p = document.createElement('p');
      p.style.margin = '0';
      p.textContent = TURN.a;
      msg.appendChild(p);

      const sources = document.createElement('div');
      sources.className = 'tool-mock__sources';
      const source = document.createElement('a');
      source.href = '#';
      source.className = 'tool-mock__source';
      source.textContent = `Source: ${TURN.source}`;
      sources.appendChild(source);
      msg.appendChild(sources);
      thread.appendChild(msg);

      const next = document.createElement('a');
      next.href = '#';
      next.className = 'tool-mock__next tool-mock__fade-in';
      next.innerHTML = `${TURN.next} <svg width="11" height="11" viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M2.5 6h7M6 2.5 9.5 6 6 9.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
      thread.appendChild(next);
    }

    function showGreeting() {
      const greeting = document.createElement('div');
      greeting.className = 'tool-mock__greeting tool-mock__fade-in';
      greeting.innerHTML = `
        <span class="tool-mock__greeting-icon" aria-hidden="true">&#10022;</span>
        <div class="tool-mock__greeting-title">Hi there, welcome back to Dexter</div>
        <div class="tool-mock__greeting-sub">Pick up a recent chat, or ask something new.</div>
        <div class="tool-mock__greeting-chips">
          <span class="tool-mock__greeting-chip">Chicago claim, loss summary<span>Today, 9:41 AM</span></span>
          <span class="tool-mock__greeting-chip">7-location risk comparison<span>Yesterday, 4:12 PM</span></span>
        </div>
      `;
      thread.appendChild(greeting);
      return greeting;
    }

    async function runTurn() {
      thread.innerHTML = '';
      composerInner.textContent = 'Ask Dexter a question\u2026';
      setCursorTyping(false);

      showGreeting();
      scrollToBottom();
      await wait(2600);

      moveCursorTo(composer, 24, 12);
      await wait(1000);
      setCursorTyping(true);
      await typeText(composerInner, TURN.q, 36);
      scrollToBottom();
      await wait(650);
      setCursorTyping(false);

      moveCursorTo(sendBtn, 10, 10);
      await wait(1400);
      sendBtn.classList.add('is-active');
      clickPulse();
      await wait(250);
      sendBtn.classList.remove('is-active');

      appendMessage('user', TURN.q);
      composerInner.textContent = '';
      scrollToBottom();

      const thinking = document.createElement('div');
      thinking.className = 'tool-mock__thinking';
      thinking.innerHTML = '<span class="tool-mock__thinking-icon" aria-hidden="true">&#10022;</span> Dexter is thinking';
      thread.appendChild(thinking);
      scrollToBottom();
      await wait(1650);
      thinking.remove();

      appendBotReply();
      scrollToBottom();
      await wait(3600);
    }

    async function runDemo() {
      cursor.classList.add('is-active');
      for (;;) {
        await runTurn();
      }
    }

    if ('IntersectionObserver' in window) {
      const heroChatObserver = new IntersectionObserver((entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            heroChatObserver.disconnect();
            runDemo();
          }
        });
      }, { threshold: 0.4 });
      heroChatObserver.observe(mock);
    } else {
      runDemo();
    }
  })();
</script>
</body></html>
